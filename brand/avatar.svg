<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF1F62"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a0510"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </radialGradient>
  </defs>

  <!-- Square fill (YouTube circle-crops the corners) -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="400" cy="400" r="370" fill="none" stroke="url(#hot)" stroke-width="14"/>

  <!-- Tiny "trending up" indicator at the top -->
  <g transform="translate(400 130)" stroke="url(#hot)" stroke-width="14" stroke-linecap="round" fill="none">
    <polyline points="-70,30 -25,-15 15,5 70,-40"/>
    <polyline points="40,-40 70,-40 70,-10"/>
  </g>

  <!-- The T -->
  <text x="400" y="430"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="520"
        letter-spacing="-30"
        fill="url(#hot)">T</text>

  <!-- Wordmark below (small enough to survive the circle crop) -->
  <text x="400" y="700"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="58"
        letter-spacing="6"
        fill="#FFFFFF">TRENDIEST</text>
</svg>
