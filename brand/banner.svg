<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0510"/>
      <stop offset="0.45" stop-color="#0b0b0f"/>
      <stop offset="1" stop-color="#1a0510"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1F62"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3A4D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF3A4D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>
  <ellipse cx="1280" cy="720" rx="1100" ry="450" fill="url(#glow)"/>

  <!-- Faint horizontal gridlines well outside the wordmark zone -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2">
    <line x1="0" y1="240" x2="2560" y2="240"/>
    <line x1="0" y1="1200" x2="2560" y2="1200"/>
  </g>

  <!-- Decorative corner arrows (kept far from the wordmark) -->
  <g stroke="url(#hot)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55">
    <polyline points="160,300 260,220 360,260 460,160"/>
    <polyline points="430,160 460,160 460,200"/>
    <polyline points="2400,1140 2300,1220 2200,1180 2100,1280" />
    <polyline points="2130,1280 2100,1280 2100,1240"/>
  </g>

  <!-- Centered safe area (~1546x423 visible on every device) -->
  <g transform="translate(1280 720)" text-anchor="middle">
    <!-- Pill, well above the wordmark -->
    <g transform="translate(0 -300)">
      <rect x="-280" y="-32" width="560" height="64" rx="32" fill="url(#hot)"/>
      <text dominant-baseline="central"
            font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
            font-weight="900" font-size="38" fill="#0b0b0f" letter-spacing="6">▲ TRENDING NOW</text>
    </g>

    <!-- Wordmark (vertically centered around origin) -->
    <text dominant-baseline="central"
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-weight="900" font-size="280" fill="#FFFFFF" letter-spacing="-6">TRENDIEST</text>

    <!-- Gradient bar -->
    <rect x="-580" y="180" width="1160" height="14" fill="url(#hot)" rx="7"/>

    <!-- Tagline -->
    <text y="270" dominant-baseline="hanging"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-weight="500" font-size="58" fill="#FFFFFF" opacity="0.85">60-second drops on what's hot.</text>

    <!-- Subtitle -->
    <text y="350" dominant-baseline="hanging"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-weight="400" font-size="34" fill="#FFFFFF" opacity="0.55" letter-spacing="4">NEW SHORTS DAILY</text>
  </g>
</svg>
